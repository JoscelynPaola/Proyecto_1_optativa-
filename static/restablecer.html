<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nueva contraseña</title>
<body style="font-family:sans-serif;max-width:380px;margin:60px auto">
<h2>Nueva contraseña</h2>
<input id="pw" type="password" placeholder="Nueva contraseña (mín. 6)" style="width:100%;padding:8px">
<button onclick="guardar()" style="margin-top:10px;padding:8px 14px">Guardar</button>
<p id="msg"></p>
<script>
async function guardar(){
  const token = new URLSearchParams(location.search).get('token');
  const r = await fetch('/restablecer-password',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token, password_nueva:document.getElementById('pw').value})});
  const d = await r.json();
  document.getElementById('msg').textContent = d.mensaje || d.detail || 'Error';
}
</script></body></html>
